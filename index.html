<style>
  :root{
    --indigo: #1c2b4a;
    --indigo-deep: #10192e;
    --marigold: #e0a626;
    --brick: #b23a2e;
    --sand: #f2e9d8;
    --ivory: #faf6ec;
    --line: rgba(28,43,74,0.14);
    --ink: #1c2b4a;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ scroll-behavior:smooth; }
  body{
    font-family:'Manrope', sans-serif;
    color:var(--ink);
    background:var(--ivory);
    line-height:1.65;
    overflow-x:hidden;
  }
  h1,h2,h3,.display{ font-family:'Fraunces', serif; }
  a{ text-decoration:none; color:inherit; }
  .wrap{ max-width:1100px; margin:0 auto; padding:0 24px; }

  /* -------- Nav -------- */
  header{
    position:sticky; top:0; z-index:50;
    background:rgba(250,246,236,0.92);
    backdrop-filter: blur(8px);
    border-bottom:1px solid var(--line);
  }
  nav{ display:flex; align-items:center; justify-content:space-between; padding:16px 24px; max-width:1100px; margin:0 auto; flex-wrap:wrap; gap:12px; }
  .brand{ font-family:'Fraunces', serif; font-weight:700; font-size:1.3rem; letter-spacing:0.02em; }
  .brand span{ color:var(--brick); }
  .navlinks{ display:flex; gap:24px; font-weight:600; font-size:0.9rem; flex-wrap:wrap; }
  .navlinks a{ position:relative; padding-bottom:4px; }
  .navlinks a::after{
    content:""; position:absolute; left:0; bottom:0; width:0; height:2px;
    background:var(--marigold); transition:width .25s ease;
  }
  .navlinks a:hover::after{ width:100%; }

  /* -------- Hero -------- */
  .hero{
    position:relative;
    padding:100px 24px 85px;
    background:
      radial-gradient(circle at 85% 20%, rgba(224,166,38,0.18), transparent 45%),
      radial-gradient(circle at 10% 90%, rgba(178,58,46,0.10), transparent 40%),
      var(--indigo);
    color:var(--ivory);
    overflow:hidden;
  }
  .hero::before{
    content:"";
    position:absolute; inset:0;
    background-image:
      repeating-linear-gradient(45deg, rgba(224,166,38,0.045) 0 2px, transparent 2px 26px),
      repeating-linear-gradient(-45deg, rgba(224,166,38,0.045) 0 2px, transparent 2px 26px);
    pointer-events:none;
  }
  .hero-inner{ position:relative; max-width:1100px; margin:0 auto; }
  .eyebrow{
    display:inline-flex; align-items:center; gap:10px;
    font-size:0.78rem; letter-spacing:0.16em; text-transform:uppercase;
    color:var(--marigold); font-weight:700; margin-bottom:20px;
  }
  .eyebrow::before{ content:""; width:26px; height:2px; background:var(--marigold); display:inline-block; }
  .hero h1{
    font-size:clamp(2.4rem, 5.5vw, 4.3rem);
    font-weight:600;
    line-height:1.06;
    max-width:800px;
    letter-spacing:-0.01em;
  }
  .hero h1 em{ font-style:italic; color:var(--marigold); }
  .hero p.lede{
    max-width:600px; margin-top:22px; font-size:1.08rem;
    color:rgba(250,246,236,0.82);
  }
  .hero-cta{ display:flex; gap:14px; margin-top:34px; flex-wrap:wrap; }
  .btn{
    display:inline-block; padding:13px 26px; border-radius:3px;
    font-weight:700; font-size:0.92rem; letter-spacing:0.01em;
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .btn-primary{ background:var(--marigold); color:var(--indigo-deep); }
  .btn-primary:hover{ transform:translateY(-2px); box-shadow:0 10px 24px rgba(224,166,38,0.35); }
  .btn-ghost{ border:1px solid rgba(250,246,236,0.35); color:var(--ivory); }
  .btn-ghost:hover{ border-color:var(--ivory); }

  .hero-stats{
    display:flex; gap:20px; margin-top:60px; border-top:1px solid rgba(250,246,236,0.18); padding-top:26px;
    flex-wrap:wrap;
  }
  .stat{ flex:1; min-width:160px; }
  .stat b{ font-family:'Fraunces', serif; font-size:1.75rem; display:block; color:var(--marigold); font-weight:600; }
  .stat span{ font-size:0.82rem; color:rgba(250,246,236,0.68); }

  /* -------- Sections -------- */
  section{ padding:85px 0; }
  .tag{
    font-size:0.78rem; letter-spacing:0.16em; text-transform:uppercase;
    color:var(--brick); font-weight:800; margin-bottom:12px; display:block;
  }
  .sec-head{ max-width:680px; margin-bottom:48px; }
  .sec-head h2{ font-size:clamp(1.85rem,3.4vw,2.6rem); font-weight:600; line-height:1.15; }
  .sec-head p{ margin-top:14px; color:#4a5470; font-size:1.02rem; }

  .about-grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap:48px; align-items:start; }
  .about-grid p{ color:#3c4560; margin-bottom:16px; }
  .timeline{ border-left:2px solid rgba(28,43,74,0.2); padding-left:26px; display:flex; flex-direction:column; gap:28px; }
  .tl-item h4{ font-family:'Fraunces', serif; font-size:1.15rem; font-weight:600; margin-bottom:5px; }
  .tl-item p{ color:#4a5470; font-size:0.94rem; margin-bottom:0; }
  .tl-dot{ position:relative; }
  .tl-dot::before{
    content:""; position:absolute; left:-31.5px; top:6px;
    width:9px; height:9px; border-radius:50%; background:var(--marigold);
    box-shadow:0 0 0 4px var(--sand);
  }
  .ivory-tl .tl-dot::before{ box-shadow:0 0 0 4px var(--ivory); }

  /* -------- Cards Grid -------- */
  .cards-grid{
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
    gap: 28px;
  }
  .pro-card{
    background: var(--ivory);
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .pro-card:hover{
    transform: translateY(-4px);
    box-shadow: 0 12px 28px rgba(28,43,74,0.1);
  }
  .pro-card img{
    width: 100%;
    height: 245px;
    object-fit: cover;
    background: var(--indigo);
    display: block;
  }
  .pro-card-body{
    padding: 24px;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .pro-role{
    font-size: 0.72rem;
    font-weight: 800;
    color: var(--brick);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .pro-card h3{
    margin: 6px 0 8px;
    font-size: 1.25rem;
  }
  .pro-card p{
    font-size: 0.9rem;
    color: #4a5470;
    margin-bottom: 16px;
  }
  .pro-btn{
    display: inline-block;
    background: var(--indigo);
    color: var(--marigold);
    text-align: center;
    padding: 10px 16px;
    border-radius: 4px;
    font-weight: 700;
    font-size: 0.85rem;
  }

  /* -------- Footer -------- */
  footer{
    background: var(--indigo-deep);
    color: rgba(250,246,236,0.65);
    text-align: center;
    padding: 28px 24px;
    font-size: 0.85rem;
    border-top: 1px solid rgba(250,246,236,0.1);
  }
</style>
